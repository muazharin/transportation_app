name: latransportindo
version: 1.0.0+1
publish_to: none
description: A new Flutter project.
environment: 
  sdk: '>=2.19.5 <3.0.0'

dependencies: 
  cupertino_icons: ^1.0.2
  get: 4.6.5
  google_fonts: 4.0.3
  get_storage: 2.1.1
  dotted_border: 2.1.0
  intl: 0.18.1
  dio: 5.4.0
  jwt_decoder: 2.0.1
  lazy_load_scrollview: 1.3.0
  syncfusion_flutter_datepicker: 21.2.4
  flutter: 
    sdk: flutter

dev_dependencies: 
  flutter_lints: ^2.0.0
  flutter_launcher_icons: 0.13.1
  flutter_test: 
    sdk: flutter

flutter_icons: 
  android: launcher_icon
  image_path: assets/icons/truck.png
  ios: true
  min_sdk_android: 21

flutter: 
  assets: 
    - assets/icons/
    - assets/illustrations/
  uses-material-design: true

